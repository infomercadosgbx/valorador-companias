name: Actualizar datos

on:
  schedule:
    # 23:17 UTC, lunes a viernes: tras el cierre de EE. UU. (20:00/21:00 UTC) y la
    # ventana de presentaciones de la SEC (hasta las 22:00 UTC). En Madrid, 00:17 o 01:17.
    - cron: "17 23 * * 1-5"
    # Día de resultados (solo las compañías que presentan; si no toca ninguna, no hace nada).
    # 12:37 UTC = 7:37 h en Nueva York: notas publicadas antes de la apertura y premercado de quien presentó ayer tras el cierre.
    - cron: "37 12 * * 1-5"
    # 14:22 UTC = 9:22 h en Nueva York: última lectura del premercado.
    - cron: "22 14 * * 1-5"
    # 21:41 UTC = 16:41 h en Nueva York: notas publicadas tras el cierre y primer after-hours.
    - cron: "41 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers a actualizar separados por espacios (vacío = todos). Úsalo el día de resultados con el ticker de la compañía."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  elegir:
    runs-on: ubuntu-latest
    outputs:
      tickers: ${{ steps.sel.outputs.tickers }}
      seguir: ${{ steps.sel.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: sel
        env:
          CRON: ${{ github.event.schedule }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          case "$CRON" in
            "37 12 * * 1-5"|"22 14 * * 1-5") t=$(python -m fetcher.dia_resultados manana) ;;
            "41 21 * * 1-5") t=$(python -m fetcher.dia_resultados tarde) ;;
            *) t="$TICKERS"; echo "seguir=true" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ -n "$CRON" ] && [ "$CRON" != "17 23 * * 1-5" ]; then
            if [ -n "$t" ]; then echo "seguir=true" >> "$GITHUB_OUTPUT"; echo "Día de resultados: $t"; else echo "Hoy no presenta ninguna compañía."; fi
          elif [ "$CRON" = "17 23 * * 1-5" ]; then echo "seguir=true" >> "$GITHUB_OUTPUT"; fi
          echo "tickers=$t" >> "$GITHUB_OUTPUT"

  actualizar:
    needs: elegir
    if: needs.elegir.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install --quiet pytest
          python -m pytest -q

      - name: Descargar datos de la SEC y precios
        id: fetch
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TICKERS: ${{ needs.elegir.outputs.tickers }}
        run: |
          if [[ ! "$TICKERS" =~ ^[A-Za-z0-9.\ -]*$ ]]; then echo "Tickers no válidos: $TICKERS"; exit 1; fi
          python -m fetcher.main --report "$RUNNER_TEMP/informe.md" ${TICKERS:+--only $TICKERS}

      - name: PDF de los informes de resultados
        continue-on-error: true
        run: |
          set +e
          python scripts/pdf_resultados.py --pendientes
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then exit 0; fi
          pip install --quiet "playwright==1.64.1"
          command -v google-chrome >/dev/null || python -m playwright install --with-deps chromium > /dev/null
          python scripts/pdf_resultados.py

      - name: Preparar avisos (zona de compra, resultados, compras de directivos…)
        id: avisos
        continue-on-error: true
        run: python -m fetcher.alerts --out "$RUNNER_TEMP/avisos.md"

      - name: Commit si algo cambió
        env:
          TICKERS: ${{ needs.elegir.outputs.tickers }}
        run: |
          git config user.name "valorador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data analysis manual; if [ -d logos ]; then git add logos; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          if [ -n "$TICKERS" ]; then msg="datos: $TICKERS $(date -u +%Y-%m-%d)"; else msg="datos: actualización $(date -u +%Y-%m-%d)"; fi
          git commit -m "$msg"
          git pull --rebase --quiet
          git push

      - name: Enviar avisos por Issue (GitHub los manda por email)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/avisos.md" ]; then echo "Sin avisos nuevos."; exit 0; fi
          gh label create aviso --color F59E0B --description "Avisos automáticos del valorador" --force >/dev/null 2>&1 || true
          n=$(grep -c '^\S.*\*\*' "$RUNNER_TEMP/avisos.md" || true)
          hoy=$(TZ=Europe/Madrid date +%d-%m-%Y)
          titulo="Avisos del valorador · último: $hoy ($n)"
          # Un solo Issue abierto que se va comentando: cada comentario llega por email igual
          # que un Issue nuevo, pero no se acumulan decenas de Issues abiertos.
          abiertos=$(gh issue list --label aviso --state open --limit 100 --json number --jq '[.[].number] | sort | reverse | .[]')
          fijo=$(echo "$abiertos" | head -n1)
          if [ -n "$fijo" ]; then
            { echo "### $hoy"; echo; cat "$RUNNER_TEMP/avisos.md"; } > "$RUNNER_TEMP/comentario.md"
            gh issue comment "$fijo" --body-file "$RUNNER_TEMP/comentario.md"
            gh issue edit "$fijo" --title "$titulo"
            for viejo in $(echo "$abiertos" | tail -n +2); do
              gh issue close "$viejo" --comment "Agrupado en #$fijo." || true
            done
          else
            { echo "Aquí llegan los avisos del valorador: cada día con novedades se añade un comentario."; echo; echo "### $hoy"; echo; cat "$RUNNER_TEMP/avisos.md"; } > "$RUNNER_TEMP/comentario.md"
            gh issue create --title "$titulo" --label aviso --body-file "$RUNNER_TEMP/comentario.md"
          fi

      - name: Abrir o actualizar un Issue si la SEC falla
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Fallo en la actualización de datos de la SEC"
          [ -f "$RUNNER_TEMP/informe.md" ] || echo "El paso de descarga falló antes de escribir el informe. Revisa el log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/informe.md"
          echo -e "\n\nEjecución: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/informe.md"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/informe.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/informe.md"
          fi

      - name: Marcar la ejecución como fallida
        if: steps.fetch.outcome == 'failure'
        run: exit 1
