name: Dev captura (temporal)
on:
  push:
    branches: [dev-captura]
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
        run: |
          if [ -f scripts/dev_run.sh ]; then bash scripts/dev_run.sh; else python scripts/dev_captura.py; fi
      - name: Commit
        run: |
          git config user.name "valorador-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f captura
          git diff --cached --quiet || git commit -m "captura [skip ci]"
          git push
