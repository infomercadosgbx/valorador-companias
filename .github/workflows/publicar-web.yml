name: Publicar web

# Publica en GitHub Pages solo los archivos de la web (no el código ni los tests).
on:
  push:
    branches: [main]
    # Estos cambios ya los publica «Rehacer informes» al terminar (workflow_run). Si también
    # se publicaran aquí, las dos publicaciones se pisaban y a veces fallaba el despliegue.
    # Si el push trae además otros archivos (p. ej. valorador.html), sí se publica aquí.
    paths-ignore:
      - "analysis/*.json"
      - "manual/*.json"
      - "i18n/notas_es.json"
  workflow_run:
    # «Mercado hoy» hace commit con GITHUB_TOKEN, que no dispara el evento push: sin esta línea,
    # el cierre de las 23:47 UTC no llegaba a la web hasta la actualización del día siguiente.
    workflows: ["Actualizar datos", "Añadir compañía", "Archivar o reactivar compañía", "Rehacer informes", "Mercado hoy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# En cola, sin cancelar: cancelar un despliegue a medias es lo que dejaba la web sin
# publicar algunas veces. Si llegan varias, GitHub deja solo la más reciente en espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp index.html valorador.html resultados.html cuenta.js companies.json ajustes.json fuentes.json logo.svg favicon.ico manifest.webmanifest _site/
          cp -r iconos _site/
          cp -r data analysis manual _site/
          if [ -d logos ]; then cp -r logos _site/; fi
          if [ -d propuestas ]; then cp -r propuestas _site/; fi
          if [ -d i18n ]; then cp -r i18n _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A veces GitHub tarda en registrar el artefacto recién subido («Found 0 artifacts»):
      # se espera un poco y se reintenta una vez.
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
