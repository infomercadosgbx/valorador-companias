name: Publicar web

# Publica en GitHub Pages solo los archivos de la web (no el código ni los tests).
on:
  push:
    branches: [main]
  workflow_run:
    # «Mercado hoy» hace commit con GITHUB_TOKEN, que no dispara el evento push: sin esta línea,
    # el cierre de las 23:47 UTC no llegaba a la web hasta la actualización del día siguiente.
    workflows: ["Actualizar datos", "Añadir compañía", "Rehacer informes", "Mercado hoy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp index.html valorador.html resultados.html companies.json ajustes.json logo.svg favicon.ico manifest.webmanifest _site/
          cp -r iconos _site/
          cp -r data analysis manual _site/
          if [ -d logos ]; then cp -r logos _site/; fi
          if [ -d propuestas ]; then cp -r propuestas _site/; fi
          if [ -d i18n ]; then cp -r i18n _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
