name: Publicar web

# Publica en GitHub Pages solo los archivos de la web (no el código ni los tests).
on:
  push:
    branches: [main]
    # Estos cambios ya los publica «Rehacer informes» al terminar (workflow_run). Si también
    # se publicaran aquí, las dos publicaciones se pisaban y a veces fallaba el despliegue.
    # Si el push trae además otros archivos (p. ej. valorador.html), sí se publica aquí.
    paths-ignore:
      - "analysis/*.json"
      - "manual/*.json"
      - "i18n/notas_es.json"
  workflow_run:
    # «Mercado hoy» hace commit con GITHUB_TOKEN, que no dispara el evento push: sin esta línea,
    # el cierre de las 23:47 UTC no llegaba a la web hasta la actualización del día siguiente.
    workflows: ["Actualizar datos", "Añadir compañía", "Archivar o reactivar compañía", "Rehacer informes", "Mercado hoy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# En cola, sin cancelar: cancelar un despliegue a medias es lo que dejaba la web sin
# publicar algunas veces. Si llegan varias, GitHub deja solo la más reciente en espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Antes de publicar: la web se abre en un navegador real con los archivos de este commit y se
      # comprueba que todas las pestañas funcionan y que datos, supuestos y cambios automáticos llegan
      # a la pantalla igual que están en data/ y analysis/. Si falla, no se publica (sigue la versión anterior).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium
      - name: Comprobar la web
        id: comprobar
        run: |
          pip install --quiet "playwright==1.64.1"
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/comprobar_web.py | tee "$RUNNER_TEMP/comprobacion.md"
      - name: Avisar si la web no pasa la comprobación
        if: failure() && steps.comprobar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="La web no se ha publicado: falla la comprobación"
          { cat "$RUNNER_TEMP/comprobacion.md"; echo; echo "Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · commit ${GITHUB_SHA::8}"; echo; echo "Sigue publicada la versión anterior. Cuando se arregle, la siguiente publicación cierra este aviso."; } > "$RUNNER_TEMP/cuerpo.md"
          n=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number' -R "$GITHUB_REPOSITORY")
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/cuerpo.md" -R "$GITHUB_REPOSITORY"
          else gh issue create --title "$titulo" --body-file "$RUNNER_TEMP/cuerpo.md" -R "$GITHUB_REPOSITORY"; fi
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp index.html valorador.html resultados.html cuenta.js companies.json ajustes.json fuentes.json logo.svg favicon.ico manifest.webmanifest _site/
          cp -r iconos css js _site/
          # Versión en los enlaces a CSS y JS: tras publicar, el navegador no mezcla un HTML nuevo con un JS viejo.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/valorador.html
          cp -r data analysis manual _site/
          if [ -d logos ]; then cp -r logos _site/; fi
          if [ -d propuestas ]; then cp -r propuestas _site/; fi
          if [ -d i18n ]; then cp -r i18n _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A veces GitHub tarda en registrar el artefacto recién subido («Found 0 artifacts»):
      # se espera un poco y se reintenta una vez.
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
      - name: Cerrar el aviso si lo había
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="La web no se ha publicado: falla la comprobación"
          for n in $(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[].number' -R "$GITHUB_REPOSITORY"); do
            gh issue close "$n" --comment "Arreglado: la comprobación pasa y la web se ha publicado (commit ${GITHUB_SHA::8})." -R "$GITHUB_REPOSITORY" || true
          done
