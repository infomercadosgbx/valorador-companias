<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{
  --k-rev:#1e3a8a; --k-gross:#6d28d9; --k-ebitda:#60a5fa; --k-op:#2563eb; --k-ni:#0e7490; --k-ocf:#14b8a6; --k-fcf:#059669;
  --k-capex:#d97706; --k-debt:#475569; --k-cash:#0d9488; --k-sbc:#a855f7; --k-buy:#4338ca; --k-div:#ca8a04; --k-rd:#7c3aed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Valorador de Compañías</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="iconos/favicon-16.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1424">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/valorador.css?v=dev">
</head>
<body>
<div class="wrap">
  <div class="appwrap">
  <div class="appbar">
    <div class="brand"><img src="logo.svg" alt="" width="26" height="26">Valorador</div>
    <button type="button" class="switch" id="btnSwitch" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker"></button>
    <div class="favs" id="favPills" role="group" aria-label="Compañías favoritas"></div>
    <div class="toolbar">
      <button type="button" id="btnHome" data-home="inicio" aria-pressed="false" title="Inicio: el mercado hoy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg> <span class="ml">Inicio</span></button>
      <div class="menuwrap"><button type="button" id="btnTools" data-menu="toolsMenu" aria-haspopup="menu" aria-expanded="false" title="Editar el análisis e informes"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg> <span class="ml">Herramientas</span> <span class="caret" aria-hidden="true">▾</span></button>
        <div class="menu" id="toolsMenu" role="menu" hidden>
          <button type="button" role="menuitem" id="btnEdit" aria-pressed="false">✎ Editar</button>
          <span class="menusep" role="separator"></span>
          <button type="button" role="menuitem" id="btnReport">⎙ Informe PDF</button>
          <button type="button" role="menuitem" id="btnResults">▤ Informe de resultados</button>
        </div></div>
      <div class="menuwrap"><button type="button" id="btnMore" data-menu="moreMenu" aria-haspopup="menu" aria-expanded="false" title="Más">⋯ <span class="ml">Más</span></button>
        <div class="menu" id="moreMenu" role="menu" hidden>
          <div class="segitems"></div>
          <span class="menusep" role="separator"></span>
          <button type="button" role="menuitem" id="btnAjustes" data-home="ajustes">⚙ Ajustes</button>
        </div></div>
    </div>
  </div>
  <div class="picker" id="picker" hidden>
    <div class="ph">
      <input type="search" id="pickQ" placeholder="Buscar por nombre, ticker o sector" aria-label="Buscar compañía" autocomplete="off" role="combobox" aria-controls="pickList" aria-expanded="true">
      <div class="sorts" role="group" aria-label="Ordenar">Ordenar:
        <button type="button" data-sort="name">Nombre</button><button type="button" data-sort="up">Potencial</button><button type="button" data-sort="score">Puntuación</button><button type="button" data-sort="recent">Actualizadas</button>
      </div>
    </div>
    <div class="plist" id="pickList" role="listbox" aria-label="Compañías"></div>
    <div class="pfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> para moverte, <kbd>Enter</kbd> para abrir, <kbd>Esc</kbd> para cerrar</span>
      <button type="button" id="btnAddCo" class="btn-acc">＋ Añadir compañía</button></div>
  </div>
  </div>
  <header class="cohead">
    <div class="idwrap"><div class="mono" id="hdrMono" aria-hidden="true"></div>
    <div class="idblock">
      <div class="eyebrow" id="hdrSector">Valorador de compañías</div>
      <h1 id="hdrName">Valorador de Compañías</h1>
      <div class="idrow" id="hdrRow"></div>
    </div></div>
    <div class="pricebox" id="priceBox"></div>
    <div class="hstrip" id="hdrStrip"></div>
  </header>
  <div class="draft" id="draftBar" hidden></div>
  <div class="stale" id="staleBox" hidden></div>
  <div id="warnBox" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones del análisis"></nav>
  <div class="rp-bar" id="rpBar"><span><b>Vista de informe</b> · elige «Guardar como PDF» como impresora</span><span style="display:flex;gap:8px"><button type="button" id="btnPrint">Imprimir / Guardar PDF</button><button type="button" class="ghost" id="btnReportExit">Volver</button></span></div>
  <main id="main"></main>
  <footer class="foot"><span>Cifras: SEC EDGAR (XBRL). Cotización y perfil: Finnhub. Histórico: Twelve Data. Se actualiza cada noche laborable.</span></footer>
</div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="cuenta.js"></script>
<script src="js/motor-dcf.js?v=dev"></script>
<script src="js/valorador.js?v=dev"></script>

</body></html>
